[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-literature-agent"
version = "0.1.0"
description = "Clinical literature research tooling with traceable evidence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml==0.7.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pypdf==6.21.2",
    "structlog==26.1.0",
]

[project.scripts]
clinical-agent = "clinical_agent.cli:main"

[project.optional-dependencies]
api = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]
rag = [
    "langgraph==1.2.17",
    "langsmith==0.14.12",
    "httpx==0.28.1",
]
db = [
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
]
ml = [
    "sentence-transformers==6.2.0",
    "transformers==5.21.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "uv==0.13.5",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_agent*", "feishu*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-m", "not external and not performance and not database",
]
markers = [
    "integration: tests of installed entry points or explicitly provisioned services",
    "external: opt-in tests using real external systems or models",
    "performance: opt-in resource and latency measurements",
    "database: opt-in isolated PostgreSQL and pgvector integration tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
